services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resolve
      POSTGRES_PASSWORD: resolve
      POSTGRES_DB: resolve
    ports:
      - "5433:5432"
    volumes:
      - resolve_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolve -d resolve"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://resolve:resolve@db:5432/resolve
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  resolve_pg_data:
